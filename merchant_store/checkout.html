<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; }
        .checkout-box { background: white; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; background: #00cc66; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #00b359; }
        #result-box { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; text-align: center; font-weight: bold;}
    </style>
</head>
<body>

<div class="checkout-box">
    <h2>🛍️ Checkout</h2>
    
    <!-- Mock Data for the ML Model -->
    <div class="form-group">
        <label>Cart Total (USD)</label>
        <input type="number" id="cart_value" value="1200">
    </div>
    <div class="form-group">
        <label>Failed Payment Attempts</label>
        <input type="number" id="failed_attempts" value="4">
    </div>
    <div class="form-group">
        <label>Account Age (Days)</label>
        <input type="number" id="account_age" value="2">
    </div>
    <div class="form-group">
        <label>Orders in Last 7 Days</label>
        <input type="number" id="orders_7d" value="5">
    </div>

    <button class="btn" onclick="submitOrder()">Pay Now</button>

    <!-- Where the AI response will show up -->
    <div id="result-box"></div>
</div>

<script>
    async function submitOrder() {
        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        resultBox.innerText = 'Processing payment securely...';
        resultBox.style.backgroundColor = '#eef';
        resultBox.style.color = '#333';

        // 1. Gather data from the form
        const payload = {
            cart_value_usd: parseFloat(document.getElementById('cart_value').value),
            failed_payment_attempts: parseInt(document.getElementById('failed_attempts').value),
            account_age_days: parseInt(document.getElementById('account_age').value),
            orders_last_7d: parseInt(document.getElementById('orders_7d').value)
        };

        try {
            // 2. Send the data to your FastAPI backend
            const response = await fetch('http://localhost:8000/score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            // 3. Display the AI's decision
            if (data.decision === 'BLOCK') {
                resultBox.style.backgroundColor = '#ffe6e6';
                resultBox.style.color = '#cc0000';
                resultBox.innerText = `⚠️ Order Hold: High Risk Detected\nRisk Score: ${data.risk_score}%`;
            } else {
                resultBox.style.backgroundColor = '#e6ffe6';
                resultBox.style.color = '#009900';
                resultBox.innerText = `✅ Payment Successful!\nRisk Score: ${data.risk_score}%`;
            }
        } catch (error) {
            resultBox.style.backgroundColor = '#fff3cd';
            resultBox.style.color = '#856404';
            resultBox.innerText = 'Error connecting to the Risk API. Is FastAPI running?';
        }
    }
</script>
</body>
</html>
